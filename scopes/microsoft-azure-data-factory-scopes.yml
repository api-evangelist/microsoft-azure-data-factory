note: Azure Data Factory has effectively ONE OAuth scope and it is not where the authorization decision is made.
  user_impersonation is the single delegated permission on the Azure Service Management API; the real permission
  model is Azure RBAC role assignment plus the Microsoft.DataFactory/* resource-provider actions those roles carry.
  Searching Microsoft documentation for a Data Factory scope reference page confirms none exists, because there
  is no scope catalogue to publish. The rows below record that honestly rather than padding the artifact with invented
  scopes.
client_credentials_scope:
  value: https://management.azure.com/.default
  note: The .default scope a service principal or managed identity requests for this audience.
rbac_actions:
  namespace: Microsoft.DataFactory/*
  discovery_operation: Operations_List
  note: The authoritative permission list is the resource-provider action list returned by GET /providers/Microsoft.DataFactory/operations?api-version=2018-06-01
    (Operations_List), which enumerates every Microsoft.DataFactory/... action a role can grant. That endpoint,
    not an OAuth scope table, is what an agent should read to reason about permissions here.
  docs: https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations
