specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: microsoft-azure-data-factory
providerId: microsoft-azure-data-factory
generated: '2026-09-17'
modified: '2026-09-17'
created: '2026-05-04'
method: probed
source: >-
  https://prices.azure.com/api/retail/prices — the Azure Retail Prices API, first-party,
  unauthenticated and machine-readable. Queried 2026-09-17 with
  $filter=serviceName eq 'Azure Data Factory v2' and armRegionName eq 'eastus' and
  priceType eq 'Consumption' (HTTP 200, 118 items). Meter names and prices below are copied
  verbatim from that response.
docs: https://azure.microsoft.com/en-us/pricing/details/data-factory/data-pipeline/
note: >-
  This replaces a 2026-05-04 scaffold that invented a "Free / 1,000 requests per month /
  10 rpm" tier. Azure Data Factory has no request-priced plans and no free API tier: it is
  consumption-billed on orchestration activity runs, integration-runtime hours, data-flow
  vCore-hours and read/write/monitoring operations. The human pricing page renders every
  figure client-side (it serves "$-" to a crawler), which is why the prices here come from the
  Retail Prices API instead. Prices are USD, East US, pay-as-you-go retail, and vary by region
  and currency — treat them as the shape of the meter, not a quote.
pricing_model: consumption
currency: USD
region_basis: eastus
billing_period: monthly (metered usage)
