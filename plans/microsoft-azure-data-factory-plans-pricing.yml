additional_meters:
  ssis_integration_runtime:
    note: >-
      SSIS integration runtime is billed per VM-hour across A-, D- and E-series SKUs in both
      Standard and Enterprise editions, with License Included and Azure Hybrid Benefit (AHB)
      rates. 96 of the 118 items returned by the Retail Prices API are these SKUs; they are
      summarised rather than listed.
    example_range_usd_per_hour:
      lowest: '0.102034'
      highest: '42.93'
free_tier:
  exists: false
  note: >-
    The pricing page states "First 5 low frequency activities in a month are free", which is a
    small usage grant on the legacy V1 meters, not a free plan. There is no free tier for the
    Data Factory REST API itself — the control-plane calls are billed as Read/Write and
    Monitoring operations. New Azure accounts get a separate platform-level free credit
    (https://azure.microsoft.com/en-us/free/), which is an Azure offer, not a Data Factory plan.
summary:
