description: 'Azure Data Factory is Microsoft''s cloud-based data integration service, orchestrating and automating
  the movement and transformation of data across ETL and ELT workloads that span cloud and on-premises stores. Its
  public interface is the Microsoft.DataFactory resource provider behind Azure Resource Manager: 104 operations over
  75 paths at api-version 2018-06-01, covering factories, pipelines and pipeline runs, datasets, linked services,
  mapping data flows, triggers, integration runtimes, credentials, global parameters, managed virtual networks and
  private endpoints, and change data capture resources. Authentication is OAuth 2.0 against Microsoft Entra ID with
  a single delegated scope, and authorization is Azure RBAC role assignment rather than API scopes. The contract is
  notable for its type system: 1,199 schema definitions, of which 121 are linked-service connector subtypes and 105
  are dataset subtypes, all resolved through OpenAPI discriminators.'
