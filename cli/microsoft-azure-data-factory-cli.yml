key_flows:
- name: Create a factory and start a pipeline run
  steps:
  - az login
  - az datafactory create --resource-group <rg> --factory-name <name> --location "East US"
  - az datafactory pipeline create --resource-group <rg> --factory-name <name> --name <pipeline>
      --pipeline @pipeline.json
  - az datafactory pipeline create-run --resource-group <rg> --factory-name <name> --name <pipeline>
  - az datafactory pipeline-run show --resource-group <rg> --factory-name <name> --run-id <runId>
- name: Cancel a running pipeline
  steps:
  - az datafactory pipeline-run query-by-factory --resource-group <rg> --factory-name <name>
      --last-updated-after <iso> --last-updated-before <iso>
  - az datafactory pipeline-run cancel --resource-group <rg> --factory-name <name> --run-id <runId>
conventions:
  conditional_write: '`--if-match` on create/update carries the resource ETag; `--if-none-match`
    on show is the conditional-GET counterpart. Same mechanism as the REST if-match header.'
  waiters: '`az datafactory trigger wait` and `az datafactory integration-runtime wait` block until
    a condition is met — the CLI''s handling of the long-running-operation polling convention.'
