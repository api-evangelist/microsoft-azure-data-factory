      - Provisioning
      - Deprovisioning
      - Disabled
      - Unknown
      x-ms-enum:
        name: EventSubscriptionStatus
        modelAsString: true
        values:
        - name: Enabled
          value: Enabled
          description: Enabled
        - name: Provisioning
          value: Provisioning
          description: Provisioning
        - name: Deprovisioning
          value: Deprovisioning
          description: Deprovisioning
        - name: Disabled
          value: Disabled
          description: Disabled
        - name: Unknown
          value: Unknown
          description: Unknown
    TriggerSubscriptionOperationStatus:
      type: object
      description: Defines the response of a trigger subscription operation.
      properties:
        triggerName:
          type: string
          description: Trigger name.
          readOnly: true
        status:
          $ref: '#/components/schemas/EventSubscriptionStatus'
          description: Event Subscription Status.
          readOnly: true
    Trigger:
      type: object
      description: Azure data factory nested object which contains information about creating pipeline run
      properties:
        type:
          type: string
          description: Trigger type.
        description:
          type: string
          description: Trigger description.
        runtimeState:
          $ref: '#/components/schemas/TriggerRuntimeState'
          description: Indicates if trigger is running or not. Updated when Start/Stop APIs are called on the Trigger.
          readOnly: true
        annotations:
          type: array
          description: List of tags that can be used for describing the trigger.
          items: {}
      discriminator:
        propertyName: type
      required:
      - type
      additionalProperties: {}
    CloudErrorBody:
      type: object
      description: The object that defines the structure of an Azure Data Factory error.
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
        target:
          type: string
          description: Property name/path in request associated with error.
        details:
          type: array
          description: Array with additional error details.
          items:
            $ref: '#/components/schemas/CloudError'
          x-ms-identifiers: []
      required:
      - code
      - message
      x-ms-external: true
    TriggerQueryResponse:
