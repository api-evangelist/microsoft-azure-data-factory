        password:
          $ref: '#/components/schemas/SecretBase'
          description: The Azure key vault secret reference of password in connection string.
        encryptionClient:
          description: 'Specifies the encryption client behavior. Supported values are accepted, rejected, requested or required,
            default value is required. Type: string. Only used for Version 2.0.'
        encryptionTypesClient:
          description: 'Specifies the encryption algorithms that client can use. Supported values are AES128, AES192, AES256,
