            trust, used by recommended version. Type: Boolean (or Expression with resultType boolean).'
        hostNameInCertificate:
          description: 'The host name to use when validating the server certificate for the connection. When not specified,
            the server name from the Data Source is used for certificate validation, used by recommended version. Type: string
            (or Expression with resultType string).'
        applicationIntent:
          description: 'The application workload type when connecting to a server, used by recommended version. Possible values
            are ReadOnly and ReadWrite. Type: string (or Expression with resultType string).'
        connectTimeout:
          description: 'The length of time (in seconds) to wait for a connection to the server before terminating the attempt
            and generating an error, used by recommended version. Type: integer (or Expression with resultType integer).'
        connectRetryCount:
          description: 'The number of re-connections attempted after identifying that there was an idle connection failure,
            used by recommended version. This must be an integer between 0 and 255. Type: integer (or Expression with resultType
            integer).'
        connectRetryInterval:
          description: 'The amount of time (in seconds) between each re-connection attempt after identifying that there was
            an idle connection failure, used by recommended version. This must be an integer between 1 and 60. Type: integer
            (or Expression with resultType integer).'
        loadBalanceTimeout:
          description: 'The minimum time, in seconds, for the connection to live in the connection pool before being destroyed,
            used by recommended version. Type: integer (or Expression with resultType integer).'
        commandTimeout:
          description: 'The default wait time (in seconds) before terminating the attempt to execute a command and generating
            an error, used by recommended version. Type: integer (or Expression with resultType integer).'
        integratedSecurity:
          description: 'Indicate whether User ID and Password are specified in the connection (when false) or whether the
            current Windows account credentials are used for authentication (when true), used by recommended version. Type:
            Boolean (or Expression with resultType boolean).'
        failoverPartner:
          description: 'The name or address of the partner server to connect to if the primary server is down, used by recommended
            version. Type: string (or Expression with resultType string).'
        maxPoolSize:
          description: 'The maximum number of connections allowed in the connection pool for this specific connection string,
            used by recommended version. Type: integer (or Expression with resultType integer).'
        minPoolSize:
          description: 'The minimum number of connections allowed in the connection pool for this specific connection string,
            used by recommended version. Type: integer (or Expression with resultType integer).'
        multipleActiveResultSets:
          description: 'When true, an application can maintain multiple active result sets (MARS). When false, an application
            must process or cancel all result sets from one batch before it can execute any other batch on that connection,
            used by recommended version. Type: Boolean (or Expression with resultType boolean).'
        multiSubnetFailover:
          description: 'If your application is connecting to an AlwaysOn availability group (AG) on different subnets, setting
            MultiSubnetFailover=true provides faster detection of and connection to the (currently) active server, used by
            recommended version. Type: Boolean (or Expression with resultType boolean).'
        packetSize:
          description: 'The size in bytes of the network packets used to communicate with an instance of server, used by recommended
            version. Type: integer (or Expression with resultType integer).'
        pooling:
          description: 'Indicate whether the connection will be pooled or explicitly opened every time that the connection
            is requested, used by recommended version. Type: Boolean (or Expression with resultType boolean).'
