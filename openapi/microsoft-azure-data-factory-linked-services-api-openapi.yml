openapi: 3.0.3
info:
  title: Azure Data Factory REST linkedServices API
  description: Azure Data Factory is a cloud-based data integration service. The Microsoft.DataFactory resource-provider REST
    API manages factories, pipelines, datasets, linked services, data flows, triggers, integration runtimes, credentials,
    managed private endpoints and change data capture resources through Azure Resource Manager.
  version: '2018-06-01'
  contact:
    name: Microsoft Azure
    url: https://learn.microsoft.com/en-us/rest/api/datafactory/
  x-source: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/datafactory/resource-manager/Microsoft.DataFactory/DataFactory/stable/2018-06-01/openapi.json
  x-source-format: Swagger 2.0 (converted verbatim to OpenAPI 3.0.3; original retained at openapi/_original/)
externalDocs:
  description: Azure Data Factory REST API reference
  url: https://learn.microsoft.com/en-us/rest/api/datafactory/
servers:
- url: https://management.azure.com
  description: Azure Resource Manager
security:
- azure_auth:
  - user_impersonation
tags:
- name: linkedServices
  description: linkedServices operations
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataFactory/factories/{factoryName}/linkedservices
  : get:
      operationId: LinkedServices_ListByFactory
      description: Lists linked services.
      tags:
      - linkedServices
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ResourceGroupNameParameter
      - name: factoryName
        in: path
        required: true
        description: The factory name.
        schema:
          type: string
          maxLength: 63
          minLength: 3
          pattern: ^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$
      responses:
        '200':
          description: Azure operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedServiceListResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        LinkedServices_ListByFactory:
          $ref: https://raw.githubusercontent.com/Azure/azure-rest-api-specs/main/specification/datafactory/resource-manager/Microsoft.DataFactory/DataFactory/stable/2018-06-01/examples/LinkedServices_ListByFactory.json
      x-ms-pageable:
        nextLinkName: nextLink
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataFactory/factories/{factoryName}/linkedservices/{linkedServiceName}
  : get:
      operationId: LinkedServices_Get
      description: Gets a linked service.
      tags:
      - linkedServices
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ResourceGroupNameParameter
      - name: factoryName
        in: path
        required: true
        description: The factory name.
        schema:
          type: string
          maxLength: 63
          minLength: 3
          pattern: ^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$
      - name: linkedServiceName
        in: path
        required: true
        description: The linked service name.
        schema:
          type: string
          maxLength: 260
          minLength: 1
          pattern: ^[A-Za-z0-9_][^<>*#.%&:\\+?/]*$
      - name: if-none-match
        in: header
        required: false
        description: ETag of the linked service entity. Should only be specified for get. If the ETag matches the existing
          entity tag, or if * was provided, then no content will be returned.
        schema:
          type: string
        x-ms-client-name: If-None-Match
      responses:
        '200':
          description: Azure operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedServiceResource'
        '304':
          description: The client has made a conditional request and the resource has not been modified.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        LinkedServices_Get:
          $ref: https://raw.githubusercontent.com/Azure/azure-rest-api-specs/main/specification/datafactory/resource-manager/Microsoft.DataFactory/DataFactory/stable/2018-06-01/examples/LinkedServices_Get.json
    put:
      operationId: LinkedServices_CreateOrUpdate
      description: Creates or updates a linked service.
      tags:
      - linkedServices
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ResourceGroupNameParameter
      - name: factoryName
        in: path
        required: true
        description: The factory name.
        schema:
          type: string
          maxLength: 63
          minLength: 3
          pattern: ^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$
      - name: linkedServiceName
        in: path
        required: true
        description: The linked service name.
        schema:
          type: string
          maxLength: 260
          minLength: 1
          pattern: ^[A-Za-z0-9_][^<>*#.%&:\\+?/]*$
      - name: if-match
        in: header
        required: false
        description: ETag of the linkedService entity.  Should only be specified for update, for which it should match existing
          entity or can be * for unconditional update.
        schema:
          type: string
        x-ms-client-name: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedServiceResource'
        description: Linked service resource definition.
      responses:
        '200':
          description: Resource 'LinkedServiceResource' update operation succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedServiceResource'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        LinkedServices_Create:
          $ref: https://raw.githubusercontent.com/Azure/azure-rest-api-specs/main/specification/datafactory/resource-manager/Microsoft.DataFactory/DataFactory/stable/2018-06-01/examples/LinkedServices_Create.json
        LinkedServices_Update:
          $ref: https://raw.githubusercontent.com/Azure/azure-rest-api-specs/main/specification/datafactory/resource-manager/Microsoft.DataFactory/DataFactory/stable/2018-06-01/examples/LinkedServices_Update.json
    delete:
      operationId: LinkedServices_Delete
      description: Deletes a linked service.
      tags:
      - linkedServices
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ResourceGroupNameParameter
      - name: factoryName
        in: path
        required: true
        description: The factory name.
        schema:
          type: string
          maxLength: 63
          minLength: 3
          pattern: ^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$
      - name: linkedServiceName
        in: path
        required: true
        description: The linked service name.
        schema:
          type: string
          maxLength: 260
          minLength: 1
          pattern: ^[A-Za-z0-9_][^<>*#.%&:\\+?/]*$
      responses:
        '200':
          description: Resource deleted successfully.
        '204':
          description: Resource does not exist.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        LinkedServices_Delete:
          $ref: https://raw.githubusercontent.com/Azure/azure-rest-api-specs/main/specification/datafactory/resource-manager/Microsoft.DataFactory/DataFactory/stable/2018-06-01/examples/LinkedServices_Delete.json
components:
  schemas:
    AmazonMWSLinkedService:
      type: object
      description: Amazon Marketplace Web Service linked service.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AmazonMWSLinkedServiceTypeProperties'
          description: Amazon Marketplace Web Service linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AmazonMWS
    AmazonMWSLinkedServiceTypeProperties:
      type: object
      description: Amazon Marketplace Web Service linked service properties.
      properties:
        endpoint:
          description: The endpoint of the Amazon MWS server, (i.e. mws.amazonservices.com)
        marketplaceID:
          description: The Amazon Marketplace ID you want to retrieve data from. To retrieve data from multiple Marketplace
            IDs, separate them with a comma (,). (i.e. A2EUQ1WTGCTBG2)
        sellerID:
          description: The Amazon seller ID.
        mwsAuthToken:
          $ref: '#/components/schemas/SecretBase'
          description: The Amazon MWS authentication token.
        accessKeyId:
          description: The access key id used to access data.
        secretKey:
          $ref: '#/components/schemas/SecretBase'
          description: The secret key used to access data.
        useEncryptedEndpoints:
          description: Specifies whether the data source endpoints are encrypted using HTTPS. The default value is true.
        useHostVerification:
          description: Specifies whether to require the host name in the server's certificate to match the host name of the
            server when connecting over SSL. The default value is true.
        usePeerVerification:
          description: Specifies whether to verify the identity of the server when connecting over SSL. The default value
            is true.
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
      required:
      - endpoint
      - marketplaceID
      - sellerID
      - accessKeyId
    AmazonRdsForLinkedServiceTypeProperties:
      type: object
      description: AmazonRdsForOracle database linked service properties.
      properties:
        connectionString:
          description: 'The connection string. Type: string, SecureString or AzureKeyVaultSecretReference. Only used for Version
            1.0.'
        server:
          description: 'The location of AmazonRdsForOracle database you want to connect to, the supported forms include connector
            descriptor, Easy Connect (Plus) Naming and Oracle Net Services Name (Only self-hosted IR). Type: string. Only
            used for Version 2.0.'
        authenticationType:
          $ref: '#/components/schemas/AmazonRdsForOracleAuthenticationType'
          description: Authentication type for connecting to the AmazonRdsForOracle database. Only used for Version 2.0.
        username:
          description: 'The AmazonRdsForOracle database username. Type: string. Only used for Version 2.0.'
        password:
          $ref: '#/components/schemas/SecretBase'
          description: The Azure key vault secret reference of password in connection string.
        encryptionClient:
          description: 'Specifies the encryption client behavior. Supported values are accepted, rejected, requested or required,
            default value is required. Type: string. Only used for Version 2.0.'
        encryptionTypesClient:
          description: 'Specifies the encryption algorithms that client can use. Supported values are AES128, AES192, AES256,
            3DES112, 3DES168, default value is (AES256). Type: string. Only used for Version 2.0.'
        cryptoChecksumClient:
          description: 'Specifies the desired data integrity behavior when this client connects to a server. Supported values
            are accepted, rejected, requested or required, default value is required. Type: string. Only used for Version
            2.0.'
        cryptoChecksumTypesClient:
          description: 'Specifies the crypto-checksum algorithms that client can use. Supported values are SHA1, SHA256, SHA384,
            SHA512, default value is (SHA512). Type: string. Only used for Version 2.0.'
        initialLobFetchSize:
          description: 'Specifies the amount that the source initially fetches for LOB columns, default value is 0. Type:
            integer. Only used for Version 2.0.'
        fetchSize:
          description: 'Specifies the number of bytes that the driver allocates to fetch the data in one database round-trip,
            default value is 10485760. Type: integer. Only used for Version 2.0.'
        statementCacheSize:
          description: 'Specifies the number of cursors or statements to be cached for each database connection, default value
            is 0. Type: integer. Only used for Version 2.0.'
        initializationString:
          description: 'Specifies a command that is issued immediately after connecting to the database to manage session
            settings. Type: string. Only used for Version 2.0.'
        enableBulkLoad:
          description: 'Specifies whether to use bulk copy or batch insert when loading data into the database, default value
            is true. Type: boolean. Only used for Version 2.0.'
        supportV1DataTypes:
          description: 'Specifies whether to use the Version 1.0 data type mappings. Do not set this to true unless you want
            to keep backward compatibility with Version 1.0''s data type mappings, default value is false. Type: boolean.
            Only used for Version 2.0.'
        fetchTswtzAsTimestamp:
          description: 'Specifies whether the driver returns column value with the TIMESTAMP WITH TIME ZONE data type as DateTime
            or string. This setting is ignored if supportV1DataTypes is not true, default value is true. Type: boolean. Only
            used for Version 2.0.'
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
    AmazonRdsForOracleAuthenticationType:
      type: string
      description: Authentication type for connecting to the AmazonRdsForOracle database. Only used for Version 2.0.
      enum:
      - Basic
      x-ms-enum:
        name: AmazonRdsForOracleAuthenticationType
        modelAsString: true
        values:
        - name: Basic
          value: Basic
          description: Basic
    AmazonRdsForOracleLinkedService:
      type: object
      description: AmazonRdsForOracle database. This linked service has supported version property. The Version 1.0 is scheduled
        for deprecation while your pipeline will continue to run after EOL but without any bug fix or new features.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AmazonRdsForLinkedServiceTypeProperties'
          description: AmazonRdsForOracle database linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AmazonRdsForOracle
    AmazonRdsForSqlAuthenticationType:
      type: string
      description: 'The type used for authentication. Type: string.'
      enum:
      - SQL
      - Windows
      x-ms-enum:
        name: AmazonRdsForSqlAuthenticationType
        modelAsString: true
        values:
        - name: SQL
          value: SQL
          description: SQL
        - name: Windows
          value: Windows
          description: Windows
    AmazonRdsForSqlServerLinkedService:
      type: object
      description: Amazon RDS for SQL Server linked service.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AmazonRdsForSqlServerLinkedServiceTypeProperties'
          description: Amazon RDS for SQL Server linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AmazonRdsForSqlServer
    AmazonRdsForSqlServerLinkedServiceTypeProperties:
      type: object
      description: Amazon Rds for SQL Server linked service properties.
      properties:
        connectionString:
          description: 'The connection string. Type: string, SecureString or AzureKeyVaultSecretReference.'
        authenticationType:
          $ref: '#/components/schemas/AmazonRdsForSqlAuthenticationType'
          description: 'The type used for authentication. Type: string.'
        userName:
          description: 'The on-premises Windows authentication user name. Type: string (or Expression with resultType string).'
        password:
          $ref: '#/components/schemas/SecretBase'
          description: The on-premises Windows authentication password.
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
        alwaysEncryptedSettings:
          $ref: '#/components/schemas/SqlAlwaysEncryptedProperties'
          description: Sql always encrypted properties.
      allOf:
      - $ref: '#/components/schemas/SqlServerBaseLinkedServiceTypeProperties'
    AmazonRedshiftLinkedService:
      type: object
      description: Linked service for Amazon Redshift.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AmazonRedshiftLinkedServiceTypeProperties'
          description: Amazon Redshift linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AmazonRedshift
    AmazonRedshiftLinkedServiceTypeProperties:
      type: object
      description: Amazon Redshift linked service properties.
      properties:
        server:
          description: 'The name of the Amazon Redshift server. Type: string (or Expression with resultType string).'
        username:
          description: 'The username of the Amazon Redshift source. Type: string (or Expression with resultType string).'
        password:
          $ref: '#/components/schemas/SecretBase'
          description: The password of the Amazon Redshift source.
        database:
          description: 'The database name of the Amazon Redshift source. Type: string (or Expression with resultType string).'
        port:
          description: 'The TCP port number that the Amazon Redshift server uses to listen for client connections. The default
            value is 5439. Type: integer (or Expression with resultType integer).'
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
      required:
      - server
      - database
    AmazonS3CompatibleLinkedService:
      type: object
      description: Linked service for Amazon S3 Compatible.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AmazonS3CompatibleLinkedServiceTypeProperties'
          description: Amazon S3 Compatible linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AmazonS3Compatible
    AmazonS3CompatibleLinkedServiceTypeProperties:
      type: object
      description: Amazon S3 Compatible linked service properties.
      properties:
        accessKeyId:
          description: 'The access key identifier of the Amazon S3 Compatible Identity and Access Management (IAM) user. Type:
            string (or Expression with resultType string).'
        secretAccessKey:
          $ref: '#/components/schemas/SecretBase'
          description: The secret access key of the Amazon S3 Compatible Identity and Access Management (IAM) user.
        serviceUrl:
          description: 'This value specifies the endpoint to access with the Amazon S3 Compatible Connector. This is an optional
            property; change it only if you want to try a different service endpoint or want to switch between https and http.
            Type: string (or Expression with resultType string).'
        forcePathStyle:
          description: 'If true, use S3 path-style access instead of virtual hosted-style access. Default value is false.
            Type: boolean (or Expression with resultType boolean).'
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
    AmazonS3LinkedService:
      type: object
      description: Linked service for Amazon S3.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AmazonS3LinkedServiceTypeProperties'
          description: Amazon S3 linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AmazonS3
    AmazonS3LinkedServiceTypeProperties:
      type: object
      description: Amazon S3 linked service properties.
      properties:
        authenticationType:
          description: 'The authentication type of S3. Allowed value: AccessKey (default) or TemporarySecurityCredentials.
            Type: string (or Expression with resultType string).'
        accessKeyId:
          description: 'The access key identifier of the Amazon S3 Identity and Access Management (IAM) user. Type: string
            (or Expression with resultType string).'
        secretAccessKey:
          $ref: '#/components/schemas/SecretBase'
          description: The secret access key of the Amazon S3 Identity and Access Management (IAM) user.
        serviceUrl:
          description: 'This value specifies the endpoint to access with the S3 Connector. This is an optional property; change
            it only if you want to try a different service endpoint or want to switch between https and http. Type: string
            (or Expression with resultType string).'
        sessionToken:
          $ref: '#/components/schemas/SecretBase'
          description: The session token for the S3 temporary security credential.
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
    AppFiguresLinkedService:
      type: object
      description: Linked service for AppFigures.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AppFiguresLinkedServiceTypeProperties'
          description: AppFigures linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AppFigures
    AppFiguresLinkedServiceTypeProperties:
      type: object
      description: AppFigures linked service type properties.
      properties:
        userName:
          description: 'The username of the Appfigures source. Type: string (or Expression with resultType string).'
        password:
          $ref: '#/components/schemas/SecretBase'
          description: The password of the AppFigures source.
        clientKey:
          $ref: '#/components/schemas/SecretBase'
          description: The client key for the AppFigures source.
      required:
      - userName
      - password
      - clientKey
    AsanaLinkedService:
      type: object
      description: Linked service for Asana.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AsanaLinkedServiceTypeProperties'
          description: Asana linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: Asana
    AsanaLinkedServiceTypeProperties:
      type: object
      description: Asana linked service type properties.
      properties:
        apiToken:
          $ref: '#/components/schemas/SecretBase'
          description: The api token for the Asana source.
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
      required:
      - apiToken
    AzureBatchLinkedService:
      type: object
      description: Azure Batch linked service.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AzureBatchLinkedServiceTypeProperties'
          description: Azure Batch linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AzureBatch
    AzureBatchLinkedServiceTypeProperties:
      type: object
      description: Azure Batch linked service properties.
      properties:
        accountName:
          description: 'The Azure Batch account name. Type: string (or Expression with resultType string).'
        accessKey:
          $ref: '#/components/schemas/SecretBase'
          description: The Azure Batch account access key.
        batchUri:
          description: 'The Azure Batch URI. Type: string (or Expression with resultType string).'
        poolName:
          description: 'The Azure Batch pool name. Type: string (or Expression with resultType string).'
        linkedServiceName:
          $ref: '#/components/schemas/LinkedServiceReference'
          description: The Azure Storage linked service reference.
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
        credential:
          $ref: '#/components/schemas/CredentialReference'
          description: The credential reference containing authentication information.
      required:
      - accountName
      - batchUri
      - poolName
      - linkedServiceName
    AzureBlobFSLinkedService:
      type: object
      description: Azure Data Lake Storage Gen2 linked service.
      properties:
        typeProperties:
          $ref: '#/components/schemas/AzureBlobFSLinkedServiceTypeProperties'
          description: Azure Data Lake Storage Gen2 linked service properties.
          x-ms-client-flatten: true
      required:
      - typeProperties
      allOf:
      - $ref: '#/components/schemas/LinkedService'
      x-ms-discriminator-value: AzureBlobFS
    AzureBlobFSLinkedServiceTypeProperties:
      type: object
      description: Azure Data Lake Storage Gen2 linked service properties.
      properties:
        url:
          description: 'Endpoint for the Azure Data Lake Storage Gen2 service. Type: string (or Expression with resultType
            string).'
        accountKey:
          description: 'Account key for the Azure Data Lake Storage Gen2 service. Type: string (or Expression with resultType
            string).'
        servicePrincipalId:
          description: 'The ID of the application used to authenticate against the Azure Data Lake Storage Gen2 account. Type:
            string (or Expression with resultType string).'
        servicePrincipalKey:
          $ref: '#/components/schemas/SecretBase'
          description: The Key of the application used to authenticate against the Azure Data Lake Storage Gen2 account.
        tenant:
          description: 'The name or ID of the tenant to which the service principal belongs. Type: string (or Expression with
            resultType string).'
        azureCloudType:
          description: 'Indicates the azure cloud type of the service principle auth. Allowed values are AzurePublic, AzureChina,
            AzureUsGovernment, AzureGermany. Default value is the data factory regions’ cloud type. Type: string (or Expression
            with resultType string).'
        encryptedCredential:
          type: string
          description: 'The encrypted credential used for authentication. Credentials are encrypted using the integration
            runtime credential manager. Type: string.'
        credential:
          $ref: '#/components/schemas/CredentialReference'
          description: The credential reference containing authentication information.
        servicePrincipalCredentialType:
          description: 'The service principal credential type to use in Server-To-Server authentication. ''ServicePrincipalKey''
            for key/secret, ''ServicePrincipalCert'' for certificate. Type: string (or Expression with resultType string).'
        servicePrincipalCredential:
          $ref: '#/components/schemas/SecretBase'
          description: The credential of the service principal object in Azure Active Directory. If servicePrincipalCredentialType
            is 'ServicePrincipalKey', servicePrincipalCredential can be SecureString or AzureKeyVaultSecretReference. If servicePrincipalCredentialType
            is 'ServicePrincipalCert', servicePrincipalCredential can only be AzureKeyVaultSecretReference.
        sasUri:
          description: 'SAS URI of the Azure Data Lake Storage Gen2 service. Type: string, SecureString or AzureKeyVaultSecretReference.'
        sasToken:
          $ref: '#/components/schemas/SecretBase'
          description: The Azure key vault secret reference of sasToken in sas uri.
    AzureBlobStorageLinkedService:
      type: object
      description: The azure blob storage linked service.
      properties:
        typeProperties:
