      tags:
      - pipelineruns
      description: Cancel a pipeline run by its run ID.
      parameters:
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ApiVersionParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/SubscriptionIdParameter
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/parameters/ResourceGroupNameParameter
      - name: factoryName
        in: path
        required: true
        schema:
          type: string
          maxLength: 63
          minLength: 3
          pattern: ^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$
      - name: runId
        in: path
        description: The pipeline run identifier.
        required: true
        schema:
          type: string
      - name: isRecursive
        in: query
        description: If true, cancel all the Child pipelines that are triggered by the current pipeline.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The request has succeeded.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
      x-ms-examples:
        PipelineRuns_Cancel:
          $ref: ./examples/PipelineRuns_Cancel.json
