components:
  schemas:
    CloudError:
      type: object
      description: The object that defines the structure of an Azure Data Factory error response.
      properties:
        error:
          $ref: '#/components/schemas/CloudErrorBody'
          description: Error data
          x-ms-client-flatten: true
      required:
      - error
      x-ms-external: true
    CloudErrorBody:
      type: object
      description: The object that defines the structure of an Azure Data Factory error.
      properties:
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Error message.
        target:
          type: string
          description: Property name/path in request associated with error.
        details:
          type: array
          description: Array with additional error details.
          items:
            $ref: '#/components/schemas/CloudError'
          x-ms-identifiers: []
      required:
      - code
      - message
      x-ms-external: true
    ConnectionStateProperties:
      type: object
      description: The connection state of a managed private endpoint
      properties:
        actionsRequired:
          type: string
          description: The actions required on the managed private endpoint
          readOnly: true
        description:
          type: string
          description: The managed private endpoint description
          readOnly: true
        status:
          type: string
          description: The approval status
          readOnly: true
    ManagedPrivateEndpoint:
      type: object
      description: Properties of a managed private endpoint
      properties:
        connectionState:
          $ref: '#/components/schemas/ConnectionStateProperties'
          description: The managed private endpoint connection state
        fqdns:
          type: array
          description: Fully qualified domain names
          items:
            type: string
        groupId:
          type: string
          description: The groupId to which the managed private endpoint is created
        isReserved:
          type: boolean
          description: Denotes whether the managed private endpoint is reserved
          readOnly: true
        privateLinkResourceId:
          type: string
          description: The ARM resource ID of the resource to which the managed private endpoint is created
        provisioningState:
          type: string
          description: The managed private endpoint provisioning state
          readOnly: true
      additionalProperties: {}
    ManagedPrivateEndpointResource:
      type: object
      description: Managed private endpoint resource type.
      properties:
        properties:
          $ref: '#/components/schemas/ManagedPrivateEndpoint'
          description: Managed private endpoint properties.
        etag:
          type: string
          description: '"If etag is provided in the response body, it may also be provided as a header per the normal etag
            convention.  Entity tags are used for comparing two or more entities from the same requested resource. HTTP/1.1
            uses entity tags in the etag (section 14.19), If-Match (section 14.24), If-None-Match (section 14.26), and If-Range
            (section 14.27) header fields.")'
          readOnly: true
      required:
      - properties
      allOf:
      - $ref: ../../../../../../common-types/resource-management/v6/types.json#/definitions/ProxyResource
    managedPrivateEndpointListResponse:
      type: object
      description: Paged collection of ManagedPrivateEndpointResource items
      properties:
        value:
          type: array
          description: The ManagedPrivateEndpointResource items on this page
          items:
            $ref: '#/components/schemas/ManagedPrivateEndpointResource'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          scopes:
            user_impersonation: impersonate your user account
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
